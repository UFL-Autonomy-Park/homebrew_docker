# apark_rise_controller on the Jetson, next to homebrew_bringup's MAVROS, in the
# same image (autonomy_park_sitl, ros2_ws/src/apark_rise_controller/README.md,
# "Running on board"). The park-frame position and the setpoint relay come
# from aero_common's aero_px4_interface, which homebrew_bringup starts with
# MAVROS; aero_common's other packages (enclosure.yaml, aero_offboard_checks)
# are in homebrew_ws too. The controller itself is in ~/experiment_ws
# (mounted at /root/experiment_ws, sourced after homebrew_ws when
# USE_EXPERIMENT_WS=true), built with the uv virtual environment
# ~/experiment_ws/venv that holds JAX (README). Run it in the foreground,
# inside tmux:
#
#   cd ~/homebrew_docker
#   sudo PARAMS=baseline_traj1.yaml docker compose -f docker-compose.yml -f rise.experiment.yml run --rm rise
#   sudo PARAMS=baseline_traj1.yaml FLY=true docker compose -f docker-compose.yml -f rise.experiment.yml run --rm rise
#
# PARAMS (required) is a controller-tuning file in apark_rise_controller's
# param/ folder, <controller>_traj<N>.yaml.
#
# The profile keeps a plain `docker compose up` from ever starting it.

services:
  rise:
    extends:
      file: docker-compose.yml
      service: homebrew_bringup
    profiles: ["experiment"]
    restart: "no"
    container_name: autonomypark-rise
    # Relative to this directory (~/homebrew_docker), so they do not depend on
    # whose home `sudo` uses. The node writes one folder per run to
    # ~/apark_rise_logs (log_dir): ~/apark_rise_logs on the Jetson.
    volumes:
      - ../experiment_ws:/root/experiment_ws
      - ../apark_rise_logs:/root/apark_rise_logs
    working_dir: /root/apark_rise_logs
    environment:
      USE_EXPERIMENT_WS: "true"
    command:
      - ros2
      - launch
      - apark_rise_controller
      - rise_controller.launch.py
      - "namespace:=${MAVROS_NAMESPACE:?set MAVROS_NAMESPACE in .env}"
      # Required; the launch file refuses an unknown one and lists the
      # choices. Not ${PARAMS:?}: compose checks that for every service in
      # the files it is given, homebrew_bringup too
      - "params_file:=${PARAMS:-PARAMS-not-set}"
      # On the Jetson, next to MAVROS
      - mavros_link:=local
      # JetPack 6.0's driver cannot run JAX's CUDA 12 wheels (README)
      - "jax_device:=${JAX_DEVICE:-cpu}"
      - sim_mode:=false
      - "fly:=${FLY:-false}"

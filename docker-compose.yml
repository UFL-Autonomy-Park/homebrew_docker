x-homebrew-common: &homebrew-common
  image: ufl-autonomy-park/homebrew-jetson:${IMAGE_TAG:-dev}

  runtime: nvidia
  network_mode: host
  ipc: host
  privileged: true
  volumes:
    - /dev:/dev
    - ./homebrew_ws:/root/homebrew_ws
    - ./config/fastdds/super_client_config.xml:/etc/fastdds/super_client_config.xml:ro
    - ./config/zed/SN${ZED_SERIAL}.conf:/usr/local/zed/settings/SN${ZED_SERIAL}.conf:ro
    - zed_resources:/usr/local/zed/resources

  environment:
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    ROS_LOCALHOST_ONLY: "${ROS_LOCALHOST_ONLY:-0}"
    RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
    USE_DISCOVERY_SERVER: "${USE_DISCOVERY_SERVER:-false}"
    USE_EXPERIMENT_WS: "false"
    NETWORK_WAIT_TIMEOUT: "${NETWORK_WAIT_TIMEOUT:-120}"
    CLOCK_WAIT_TIMEOUT: "${CLOCK_WAIT_TIMEOUT:-60}"

services:
  homebrew_bringup:
    <<: *homebrew-common

    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
      args:
        BASE_IMAGE: ${BASE_IMAGE:-zed_ros2_l4t_36.3.0_sdk_5.0.0}

    container_name: ${CONTAINER_NAME:-autonomypark}

    restart: unless-stopped

    command:
      - ros2
      - launch
      - homebrew_bringup
      - homebrew.launch.py
      - "launch_zed:=${LAUNCH_ZED:-true}"
      - "zed_model:=${ZED_MODEL:-zed2i}"
      - "zed_camera_name:=${ZED_CAMERA_NAME:-zed}"
      - "zed_namespace:=${ZED_NAMESPACE:-}"
      - "launch_mavros:=${LAUNCH_MAVROS:-true}"
      # Required, no fallback: a wrong value here mixes up vehicles
      - "fcu_url:=${FCU_URL:?set FCU_URL in .env}"
      - "mavros_namespace:=${MAVROS_NAMESPACE:?set MAVROS_NAMESPACE in .env}"
      - "mavros_tgt_system:=${MAVROS_TGT_SYSTEM:?set MAVROS_TGT_SYSTEM in .env}"
      - "mavros_respawn:=${MAVROS_RESPAWN:-true}"
      - "launch_ntrip:=${LAUNCH_NTRIP:-true}"
      - "ntrip_host:=${NTRIP_HOST:?set NTRIP_HOST in .env}"
      - "ntrip_port:=${NTRIP_PORT:-2101}"
      - "ntrip_mountpoint:=${NTRIP_MOUNTPOINT:?set NTRIP_MOUNTPOINT in .env}"
      - "ntrip_username:=${NTRIP_USERNAME:?set NTRIP_USERNAME in .env}"
      - "ntrip_password:=${NTRIP_PASSWORD:?set NTRIP_PASSWORD in .env}"

volumes:
  zed_resources:

# Upstream MAVROS plugin selection: everything except the denylist below.
# Copied from mavros 2.14.0 launch/px4_pluginlists.yaml so the comparison with
# minimal_pluginlists.yaml is explicit. Selected with MAVROS_PLUGINS=full.
/**:
  ros__parameters:
    plugin_denylist:
      # common

      # extras
      - image_pub
      - vibration
      - distance_sensor
      - rangefinder
      - wheel_odometry
